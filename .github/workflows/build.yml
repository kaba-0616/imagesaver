name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ImageSaver.xcodeproj \
            -scheme ImageSaverApp

      - name: Archive (unsigned)
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild archive \
            -project ImageSaver.xcodeproj \
            -scheme ImageSaverApp \
            -configuration Release \
            -archivePath build/ImageSaver.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee build/xcodebuild.log

      - name: Show compile errors (on failure)
        if: failure()
        run: |
          # Also written to the step summary, which is the only part of a
          # failed run readable without a token (via the check-runs API).
          # Without it a build failure is just "exit code 65".
          {
            if [ ! -f build/xcodebuild.log ]; then
              echo "### ログなし (アーカイブ開始前に失敗)"
              exit 0
            fi
            echo "### コンパイルエラー"
            echo '```'
            grep -n "error:" build/xcodebuild.log | head -n 40 || echo "(error: の行なし)"
            echo '```'
            echo "### ログ末尾"
            echo '```'
            tail -n 60 build/xcodebuild.log
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Package IPA (unsigned, for Sideloadly)
        run: |
          set -e
          APP_PATH="build/ImageSaver.xcarchive/Products/Applications"
          mkdir -p build/Payload
          cp -R "$APP_PATH"/*.app build/Payload/
          cd build
          zip -r -y ImageSaver.ipa Payload
          cd ..

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageSaver-ipa
          path: build/ImageSaver.ipa
          retention-days: 14

      - name: Show download link
        run: |
          # Artifacts have no public direct-download URL (GitHub requires a
          # logged-in session even on a public repo) -- this run's own page
          # is the closest thing to one, and is where the download button
          # actually lives.
          echo "### ビルドDLページ" >> "$GITHUB_STEP_SUMMARY"
          echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
