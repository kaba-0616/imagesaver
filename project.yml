name: ImageSaver
options:
  bundleIdPrefix: jp.kaba
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    # Team ID and profile names aren't secrets -- only the certificate/profile
    # *files* themselves (installed at CI runtime from GitHub secrets) are.
    # The unsigned build (build.yml) overrides all of this at the xcodebuild
    # command line (CODE_SIGNING_ALLOWED=NO etc.), so these defaults only
    # take effect for the signed TestFlight workflow.
    DEVELOPMENT_TEAM: BY99ZS478M
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Distribution"
    # No embedded framework copies of the Swift runtime: iOS 15+ provides it
    # natively, and any embedded dylib inside the .appex is another thing a
    # third-party resigner (Sideloadly) could fail to re-sign correctly.
    ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: NO
    # The only build this project ever ships is the Release archive built by
    # CI (there is no separate Debug distribution channel), so gating dev-only
    # tools behind DEBUG means they never reach the device that needs them.
    # This flag stays on in every build instead.
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) IMAGESAVER_DEV_TOOLS

packages:
  SwiftDraw:
    url: https://github.com/swhitty/SwiftDraw.git
    exactVersion: 0.18.3
  # Ads: main app only. The extension's memory budget is far tighter than
  # the app's (see CLAUDE.md's "踏んだら全滅する罠"), and an ad SDK has no
  # business running inside a share-sheet action anyway.
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    # Google's own docs recommend "up to next major" here rather than
    # pinning an exact patch (unlike SwiftDraw above); XcodeGen's `from`
    # is what maps to SwiftPM's .upToNextMajor(from:) -- a bare
    # `minVersion` isn't a requirement XcodeGen recognizes on its own.
    from: 13.0.0

targets:
  ImageSaverApp:
    type: application
    platform: iOS
    sources:
      - path: ImageSaverApp
      - path: Shared
    info:
      path: ImageSaverApp/Info.plist
      properties:
        CFBundleDisplayName: ImageSaver
        # Must be declared explicitly: XcodeGen does not derive these from
        # MARKETING_VERSION / CURRENT_PROJECT_VERSION, and they otherwise
        # default to 1.0/1 no matter what the build settings say.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # This app only ever talks HTTPS (standard OS-provided TLS) and
        # implements no encryption of its own, so it's exempt -- declaring
        # that here is what skips App Store Connect's "アプリの暗号化書類"
        # questionnaire on every future TestFlight/App Store submission.
        ITSAppUsesNonExemptEncryption: false
        GADApplicationIdentifier: "ca-app-pub-1034383442757151~7852513747"
        NSUserTrackingUsageDescription: "広告の表示に使う情報の取得許可をお願いします。許可しなくても広告自体は表示されますが、内容の関連性が下がります。"
        SKAdNetworkItems:
          # Google's own network ID -- the one identifier that works
          # regardless of which ad network ends up serving. The full list
          # of participating buyer IDs (see docs/monetization-todo.md)
          # should be added once a real AdMob account picks networks.
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
        NSPhotoLibraryAddUsageDescription: "選択した画像をカメラロールに保存するために使用します。"
        # Only the container app reads the library, and only for the
        # duplicate finder. The extension never asks for this level, so
        # its own Info.plist keeps the add-only key alone.
        NSPhotoLibraryUsageDescription: "重複した写真や余白のある写真を探して整理するために、写真の読み取り・削除を行います。削除するものはあなたが選んだ写真だけです。"
        UILaunchScreen: {}
        # App Store Connect validation (as of the iOS 26 SDK requirement)
        # rejects an iPad-capable app (TARGETED_DEVICE_FAMILY 1,2) that
        # doesn't declare all four orientations, since iPad multitasking
        # can present any of them regardless of what the app itself wants
        # to support on iPhone.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.kaba.imagesaverv2
        MARKETING_VERSION: "3.2.0"
        CURRENT_PROJECT_VERSION: "191"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PROVISIONING_PROFILE_SPECIFIER: "ImageSaver AppStore"
    dependencies:
      - target: ImageSaverAction
        embed: true
      - package: GoogleMobileAds

  ImageSaverAction:
    type: app-extension
    platform: iOS
    sources:
      - path: ImageSaverAction
      - path: Shared
    info:
      path: ImageSaverAction/Info.plist
      properties:
        CFBundleDisplayName: ImageSaver
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ui-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ActionViewController
          NSExtensionAttributes:
            # Web pages only. A blanket TRUEPREDICATE makes the action appear in
            # every app's share sheet, and iOS then treats its pinned position as
            # global rather than per-app.
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
            NSExtensionJavaScriptPreprocessingFile: Action
        NSPhotoLibraryAddUsageDescription: "選択した画像をカメラロールに保存するために使用します。"
        # The share sheet takes this from the extension's *app icon set*, so
        # CFBundleIconName must name an .appiconset compiled by actool.
        # Pointing it at an .imageset silently falls back to the container
        # app's icon, which is opaque and renders as a solid dark tile.
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconName: AppIcon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.kaba.imagesaverv2.action
        MARKETING_VERSION: "3.2.0"
        CURRENT_PROJECT_VERSION: "191"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: true
        PROVISIONING_PROFILE_SPECIFIER: "ImageSaverAction AppStore"
    dependencies:
      - package: SwiftDraw

schemes:
  ImageSaverApp:
    build:
      targets:
        ImageSaverApp: all
        ImageSaverAction: all
    run:
      config: Debug
    archive:
      config: Release
