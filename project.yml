name: ImageSaver
options:
  bundleIdPrefix: jp.kaba
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # No embedded framework copies of the Swift runtime: iOS 15+ provides it
    # natively, and any embedded dylib inside the .appex is another thing a
    # third-party resigner (Sideloadly) could fail to re-sign correctly.
    ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: NO

targets:
  ImageSaverApp:
    type: application
    platform: iOS
    sources:
      - path: ImageSaverApp
      - path: Shared
    info:
      path: ImageSaverApp/Info.plist
      properties:
        CFBundleDisplayName: ImageSaver
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.kaba.imagesaver
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: ImageSaverAction
        embed: true

  ImageSaverAction:
    type: app-extension
    platform: iOS
    sources:
      - path: ImageSaverAction
      - path: Shared
    info:
      path: ImageSaverAction/Info.plist
      properties:
        CFBundleDisplayName: ImageSaver
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ui-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ActionViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: TRUEPREDICATE
            NSExtensionJavaScriptPreprocessingFile: Action
        NSPhotoLibraryAddUsageDescription: "選択した画像をカメラロールに保存するために使用します。"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.kaba.imagesaver.action
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: true

schemes:
  ImageSaverApp:
    build:
      targets:
        ImageSaverApp: all
        ImageSaverAction: all
    run:
      config: Debug
    archive:
      config: Release
