name: ImageSaver
options:
  bundleIdPrefix: jp.kaba
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  SwiftDraw:
    url: https://github.com/swhitty/SwiftDraw.git
    exactVersion: 0.18.3

targets:
  ImageSaverApp:
    type: application
    platform: iOS
    sources:
      - path: ImageSaverApp
      - path: Shared
    info:
      path: ImageSaverApp/Info.plist
      properties:
        CFBundleDisplayName: ImageSaver
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: ImageSaverApp/ImageSaverApp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.jp.kaba.imagesaver
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.kaba.imagesaver
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - target: ImageSaverAction
        embed: true

  ImageSaverAction:
    type: app-extension
    platform: iOS
    sources:
      - path: ImageSaverAction
      - path: Shared
    info:
      path: ImageSaverAction/Info.plist
      properties:
        CFBundleDisplayName: ImageSaver
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.action
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ActionViewController
          NSExtensionJavaScriptPreprocessingFile: Action
          NSExtensionAttributes:
            NSExtensionActivationRule: TRUEPREDICATE
        NSPhotoLibraryAddUsageDescription: "選択した画像をカメラロールに保存するために使用します。"
    entitlements:
      path: ImageSaverAction/ImageSaverAction.entitlements
      properties:
        com.apple.security.application-groups:
          - group.jp.kaba.imagesaver
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.kaba.imagesaver.action
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: true
    dependencies:
      - package: SwiftDraw

schemes:
  ImageSaverApp:
    build:
      targets:
        ImageSaverApp: all
        ImageSaverAction: all
    run:
      config: Debug
    archive:
      config: Release
